# ------------------------------------------
# Proxy Groups
# ------------------------------------------
proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "Auto Select"
      - "Manual Select"
      - "DIRECT"

  - name: "Auto Select"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "MASQUE H2 WARP 1"
      - "MASQUE H2 WARP 2"
      - "MASQUE H2 WARP 3"

  - name: "Manual Select"
    type: select
    proxies:
      - "MASQUE H2 WARP 1"
      - "MASQUE H2 WARP 2"
      - "MASQUE H2 WARP 3"

  - name: "Iran Traffic"
    type: select
    proxies:
      - "DIRECT"
      - "PROXY"

  - name: "Ad Block"
    type: select
    proxies:
      - "REJECT"
      - "DIRECT"

# ------------------------------------------
# Rule Providers
# ------------------------------------------
rule-providers:
  iran_domains:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
    path: "./rulesets/iran_domains.yaml"
    interval: 86400
  iran_ip:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"
    path: "./rulesets/iran_ip.yaml"
    interval: 86400
  goolag_ads:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: "./rulesets/reject.yaml"
    interval: 86400

# ------------------------------------------
# Routing Rules
# ------------------------------------------
rules:
  - "GEOIP,private,DIRECT,no-resolve"
  - "RULE-SET,goolag_ads,Ad Block"
  - "GEOSITE,category-ir,Iran Traffic"
  - "GEOIP,IR,Iran Traffic"
  - "RULE-SET,iran_domains,Iran Traffic"
  - "RULE-SET,iran_ip,Iran Traffic"
  - "MATCH,PROXY"
