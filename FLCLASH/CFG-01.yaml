# ==========================================
# Clash Meta / Mihomo SS+VLESS Config
# ==========================================

port: 0
socks-port: 0
redir-port: 0
tproxy-port: 0
mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: "rule"
log-level: "warning"
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: "always"
global-client-fingerprint: "chrome"
global-ua: "FlClash/v0.8.96 clash-verge Platform/android"
keep-alive-interval: 30

# ------------------------------------------
# TUN Configuration
# ------------------------------------------
tun:
  enable: true
  stack: "mixed"
  dns-hijack:
    - "any:53"
  auto-route: true
  auto-detect-interface: true

# ------------------------------------------
# Optimized DNS Configuration
# ------------------------------------------
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.ir"
    - "stun.*.*.*"
    - "stun.*.*"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "*.ntp.org"
  default-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
  proxy-server-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
    - "https://1.1.1.1/dns-query"
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
    - "tcp://1.1.1.1"
    - "tcp://8.8.8.8"
  direct-nameserver:
    - "10.202.10.202"
    - "10.202.10.102"
    - "78.157.42.100"

